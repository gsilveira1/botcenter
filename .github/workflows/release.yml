name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: 'Deploy this release tag (vX.Y.Z) to production'
        required: true
      image:
        description: 'The image with tag and digest from the release job (ghcr.io/...:vX.Y.Z@sha256:...)'
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Build and push the image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.ref.outputs.image }}
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lowercase)
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/botcenter-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,format=long
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image reference with the digest
        id: ref
        env:
          NAME: ${{ steps.name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${NAME}:${GITHUB_REF_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Trivy scan of the pushed image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - name: Deploy command
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}\`"
            echo
            echo "### Deploy (docs/runbook.md, procedure \"Deploy a release\")"
            echo
            echo "Over Tailscale SSH on the host:"
            echo
            echo "\`sudo /opt/botcenter/infra/scripts/deploy.sh ${GITHUB_REF_NAME} ${IMAGE}\`"
            echo
            echo "Or run this workflow by hand (workflow_dispatch) with the tag and the image."
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual deploy: a person starts it (workflow_dispatch) after the release job. The environment
  # `production` must have required reviewers. The runner joins the tailnet with an ephemeral
  # OAuth client (tag:ci) and runs deploy.sh on the host over SSH. The host accepts SSH only on
  # the Tailscale interface (infra/host/bootstrap.sh).
  deploy:
    name: Deploy to production (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.deploy_tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag"; exit 1; }
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+:[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::the image needs a tag and a digest"; exit 1; }
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Run deploy.sh on the host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TAG: ${{ inputs.deploy_tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /opt/botcenter/infra/scripts/deploy.sh "$TAG" "$IMAGE"
