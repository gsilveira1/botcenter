name: Security

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    # Every Monday at 04:00 UTC: new CVEs for an unchanged image.
    - cron: '0 4 * * 1'

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The container needs no license (the gitleaks action needs one for an organization).
      - name: gitleaks (all commits)
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner --exit-code 1 --log-opts="--all"

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: botcenter-api:scan
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Trivy (HIGH and CRITICAL with a fix fail the job)
        run: |
          mkdir -p trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/trivy:/out" \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format sarif --output /out/trivy.sarif botcenter-api:scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 botcenter-api:scan
      - name: Upload the Trivy report to code scanning
        if: always() && hashFiles('trivy/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy/trivy.sarif
          category: trivy-api-image

  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
