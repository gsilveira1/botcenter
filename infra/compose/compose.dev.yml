# Local development stack of Bot Center: PostgreSQL 16, Redis 7, Evolution API v2.3.7, and MinIO.
# The API and the workers run on the host (`pnpm --filter @botcenter/api dev`).
#
#   docker compose -f infra/compose/compose.dev.yml up -d
#   docker compose -f infra/compose/compose.dev.yml down        # keeps the volumes
#   docker compose -f infra/compose/compose.dev.yml down -v     # deletes the local data
#
# Every port binds to 127.0.0.1 only. The passwords below are development values (not secrets).
# To change one, set the variable in the shell or in `infra/compose/.env` (git ignores it).
# The default values match the root `.env.example`:
#   DATABASE_URL=postgresql://botcenter_app:change-me@localhost:5432/botcenter
#   DATABASE_URL_MIGRATE=postgresql://botcenter_owner:change-me@localhost:5432/botcenter
#   REDIS_URL=redis://localhost:6379/0
#   EVOLUTION_BASE_URL=http://localhost:8080  EVOLUTION_API_KEY=dev-evolution-api-key
#   S3_ENDPOINT=http://localhost:9000  S3_BUCKET=botcenter-media  S3_ACCESS_KEY_ID=botcenter  S3_SECRET_ACCESS_KEY=change-me-minio
#
# The Evolution container sends the instance webhooks to the API on the host. Give the API the internal
# webhook URL `http://host.docker.internal:3000/internal/evolution/webhook` in local runs.
name: botcenter-dev

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
      BOTCENTER_OWNER_PASSWORD: ${BOTCENTER_OWNER_PASSWORD:-change-me}
      BOTCENTER_APP_PASSWORD: ${BOTCENTER_APP_PASSWORD:-change-me}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:-change-me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d botcenter']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # AOF on, as in production. noeviction: BullMQ must never lose a job key.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./evolution.flags.env
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-api-key}
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-change-me}@postgres:5432/evolution?schema=evolution_api
      CACHE_REDIS_URI: redis://redis:6379/1
      # Development only: more log lines than production.
      LOG_LEVEL: ERROR,WARN,INFO
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${EVOLUTION_PORT:-8080}:8080'
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # MinIO stopped its Docker Hub images in 2025. `pgsty/minio` is a community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-botcenter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12

  # Creates the private media bucket once (idempotent), then exits. No anonymous access.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-botcenter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-botcenter-media}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        echo "minio-init: bucket $$S3_BUCKET is ready"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  evolution-instances:
  minio-data:
